# Matches slide 11 verbatim. References the Secret by name only — no
# credential value ever lives here. The Secret itself is created
# out-of-band by scripts/02-create-secret.ps1 before the talk.
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: azure-creds
      key: creds
