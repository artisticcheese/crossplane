# Matches slide 12 ("Your First Resources") verbatim: a namespaced
# Managed Resource, applied directly — no Claim required (Crossplane v2).
#
# Labels beyond what the slide shows are added so demo2 can select these
# same objects via matchLabels (a more robust selector for resources that
# don't share a controller owner) rather than duplicating them.
apiVersion: azure.upbound.io/v1beta1
kind: ResourceGroup
metadata:
  name: demo-rg
  namespace: team-a
  labels:
    demo.crossplane.io/stack: team-a
    demo.crossplane.io/role: resource-group
spec:
  forProvider:
    location: westeurope
---
# storageAccountName (metadata.name) must be globally unique across all of
# Azure — change "demosa001" before the talk if it's already taken.
apiVersion: storage.azure.upbound.io/v1beta1
kind: Account
metadata:
  name: demosa001
  namespace: team-a
  labels:
    demo.crossplane.io/stack: team-a
    demo.crossplane.io/role: storage-account
spec:
  forProvider:
    location: westeurope
    accountTier: Standard
    accountReplicationType: LRS
    resourceGroupNameSelector:
      matchControllerRef: true
