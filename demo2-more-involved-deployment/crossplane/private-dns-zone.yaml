# The zone name is not arbitrary — Azure's private-link DNS integration
# for Blob Storage specifically resolves through
# privatelink.blob.core.windows.net.
apiVersion: network.azure.upbound.io/v1beta1
kind: PrivateDNSZone
metadata:
  name: privatelink.blob.core.windows.net
  namespace: team-a
  labels:
    demo.crossplane.io/stack: team-a
    demo.crossplane.io/role: private-dns-zone
spec:
  forProvider:
    resourceGroupNameSelector:
      matchLabels:
        demo.crossplane.io/stack: team-a
        demo.crossplane.io/role: resource-group
