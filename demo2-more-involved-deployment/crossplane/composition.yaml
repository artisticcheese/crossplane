# Replaces the 5 independently-applied Managed Resources this demo used
# to ship (virtual-network.yaml, subnet.yaml, private-dns-zone.yaml,
# private-dns-zone-vnet-link.yaml, private-endpoint.yaml) with a single
# namespaced XR whose Composition wires all of them together via a
# function-patch-and-transform pipeline. Matches slide 13 ("A More
# Involved Deployment") and slide 14 ("Why XRs & XRDs?"). The
# CompositeResourceDefinition this Composition implements lives in
# xrd.yaml, alongside this file — both owned by the platform team. Each
# consuming team applies their own instance from teams/<team>/xr.yaml.
#
# Unlike the first version of this file, the storage account is now
# composed here too — a fresh, private-by-default Account, not demo 1's
# pre-existing "demosa001" (see storage-account-private.yaml's removal).
# The only thing this XR still reaches outside itself for is the
# ResourceGroup, which demo 1 applies directly.
#
# Selector convention used below:
#   - matchControllerRef: true  -> the target is composed by *this* XR.
#     Crossplane sets the controller reference on every resource it
#     composes, so siblings can always find each other this way — the
#     same mechanism demo 1's ResourceGroup/Account pair already uses.
#   - matchLabels                -> the target is owned by a *different*
#     controller. Only the resource group is external here — applied
#     directly by demo 1 — so matchControllerRef would not find it.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: private-storage-azure
spec:
  compositeTypeRef:
    apiVersion: mycompany.com/v1
    kind: XPrivateStorage
  mode: Pipeline
  pipeline:
    - step: compose-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: vnet
            base:
              apiVersion: network.azure.upbound.io/v1beta1
              kind: VirtualNetwork
              metadata:
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: virtual-network
              spec:
                forProvider:
                  addressSpace: ["10.0.0.0/16"]
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location

          - name: subnet
            base:
              apiVersion: network.azure.upbound.io/v1beta1
              kind: Subnet
              metadata:
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: subnet
              spec:
                forProvider:
                  addressPrefixes: ["10.0.1.0/24"]
                  privateEndpointNetworkPolicies: Disabled
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group
                  virtualNetworkNameSelector:
                    matchControllerRef: true

          - name: storage-account
            base:
              apiVersion: storage.azure.upbound.io/v1beta1
              kind: Account
              metadata:
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: storage-account
              spec:
                forProvider:
                  accountTier: Standard
                  accountReplicationType: LRS
                  publicNetworkAccessEnabled: false
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                # metadata.name (the actual Azure storage account name)
                # must be globally unique across all of Azure — this is
                # why it comes from the XR's spec instead of being
                # hardcoded, so each team's instance names its own.
                fromFieldPath: spec.storageAccountName
                toFieldPath: metadata.name

          - name: private-dns-zone
            base:
              apiVersion: network.azure.upbound.io/v1beta1
              kind: PrivateDNSZone
              metadata:
                # Not a placeholder — Azure's private-link DNS integration
                # for Blob Storage specifically resolves through this
                # exact zone name. Unlike the storage account/endpoint
                # below, this name can't be parameterized per team — it's
                # fixed by Azure. Only one XR instance can compose it at a
                # time; running a second team's instance while the first
                # is still up will fail trying to recreate the same zone.
                # Fine for this demo (present one team live), but a real
                # multi-tenant setup would make this an externally-shared
                # resource selected via matchLabels, like the ResourceGroup.
                name: privatelink.blob.core.windows.net
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: private-dns-zone
              spec:
                forProvider:
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group

          - name: private-dns-zone-vnet-link
            base:
              apiVersion: network.azure.upbound.io/v1beta1
              kind: PrivateDNSZoneVirtualNetworkLink
              metadata:
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: private-dns-zone-vnet-link
              spec:
                forProvider:
                  registrationEnabled: false
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group
                  privateDnsZoneNameSelector:
                    matchControllerRef: true
                  virtualNetworkIdSelector:
                    matchControllerRef: true

          - name: private-endpoint
            base:
              apiVersion: network.azure.upbound.io/v1beta1
              kind: PrivateEndpoint
              metadata:
                labels:
                  mycompany.com/stack: team-a
                  mycompany.com/role: private-endpoint
              spec:
                forProvider:
                  resourceGroupNameSelector:
                    matchLabels:
                      mycompany.com/stack: team-a
                      mycompany.com/role: resource-group
                  subnetIdSelector:
                    matchControllerRef: true
                  privateServiceConnection:
                    - isManualConnection: false
                      subresourceNames: ["blob"]
                      # Targets the storage-account resource composed
                      # above, by this same XR — matchControllerRef.
                      privateConnectionResourceIdSelector:
                        matchControllerRef: true
                  privateDnsZoneGroup:
                    - name: default
                      privateDnsZoneIdsSelector:
                        matchControllerRef: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.location
                toFieldPath: spec.forProvider.location
              - type: CombineFromComposite
                # Derived from storageAccountName (not hardcoded) so two
                # teams' instances don't collide on this name either.
                combine:
                  variables:
                    - fromFieldPath: spec.storageAccountName
                  strategy: string
                  string:
                    fmt: "pe-%s"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.storageAccountName
                  strategy: string
                  string:
                    fmt: "psc-%s"
                toFieldPath: spec.forProvider.privateServiceConnection[0].name

    - step: auto-ready
      functionRef:
        name: function-auto-ready
      input:
        apiVersion: autoready.fn.crossplane.io/v1beta1
        kind: Input
