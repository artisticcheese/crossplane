# The CompositeResourceDefinition (XRD) for this demo's XR. Defines the
# namespaced XPrivateStorage kind and its schema. Owned by the platform
# team; composition.yaml (also here) implements it, and each consuming
# team applies their own instance from teams/<team>/xr.yaml. Matches
# slide 13 ("A More Involved Deployment") and slide 14 ("Why XRs &
# XRDs?").
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xprivatestorages.mycompany.com
spec:
  scope: Namespaced
  group: mycompany.com
  names:
    kind: XPrivateStorage
    plural: xprivatestorages
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                location:
                  type: string
                  description: Azure region for the VNet, storage account, and private endpoint.
                storageAccountName:
                  type: string
                  description: >-
                    Globally-unique Azure storage account name for this
                    instance. Also derives the private endpoint and
                    private service connection names, so two teams'
                    instances never collide.
              required:
                - location
                - storageAccountName
